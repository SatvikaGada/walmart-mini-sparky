services:
  postgres:
    image: postgres:16
    container_name: minisparky-db
    environment:
      POSTGRES_DB: minisparky
      POSTGRES_USER: minisparky
      POSTGRES_PASSWORD: minisparky
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U minisparky -d minisparky"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata: