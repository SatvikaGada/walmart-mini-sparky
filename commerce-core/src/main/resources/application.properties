spring.application.name=commerce-core

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/minisparky}
spring.datasource.username=${DB_USER:minisparky}
spring.datasource.password=${DB_PASSWORD:minisparky}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

app.agent-api-key=${AGENT_API_KEY:dev-agent-key-change-me}
app.user-token-secret=${USER_TOKEN_SECRET:dev-user-secret-change-me}
app.cart-ttl-seconds=${CART_TTL_SECONDS:600}
app.max-cart-total-paise=${MAX_CART_TOTAL_PAISE:1000000}
app.max-lines-per-cart=${MAX_LINES_PER_CART:25}
app.agent-max-calls-per-minute=${AGENT_MAX_CALLS_PER_MINUTE:40}
spring.datasource.hikari.maximum-pool-size=20